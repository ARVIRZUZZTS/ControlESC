<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>PLANILLAS DE BUSES</title>
    <link rel="stylesheet" href="css/planillas.css">    
<link rel="stylesheet" href="css/layout2.css"></head>
<body>
    <header>
        <img src="img/logoX.png" alt="Logo">
        <div>
            <h1>PLANILLAS DE BUSES</h1>
            <h3 id="fecha"></h3>
            <h3 id="hora"></h3>
        </div>
    </header>

    <main>
        <div></div>
        <div id="botones">
            <div class="bot">
            <button id="crear" onclick="crear()">
                <span class="emoji">🗂️</span>
                <span>NUEVA</span>
            </button>
            </div>
            <div class="bot">
            <button id="back" onclick="back()">
                <span class="emoji">⬅️</span>
                <span>ATRAS</span>
            </button>
            </div>
        </div>
        <div id="lista"></div>
    </main>

    <script src="js/planillas.js"></script>
</body>
</html>
